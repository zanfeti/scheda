<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111310">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.svg">
<title>Workout — Scheda</title>
<style>
:root{color-scheme:dark;--bg:#111310;--panel:#1a1d19;--panel2:#222620;--line:#343a31;--text:#f2f4ed;--muted:#a6ada0;--accent:#c5f36b;--accent-ink:#18200d;--danger:#ff9b91;--radius:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.4;padding-bottom:calc(24px + env(safe-area-inset-bottom))}button,input{font:inherit}button{cursor:pointer}.app{max-width:720px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 28px}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:800}.week-label{border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--muted);font-size:12px}.title{font-size:32px;letter-spacing:-.05em;margin:8px 0 4px;font-weight:850}.sub{color:var(--muted);margin:0 0 20px}.day-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}.day-tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:14px;padding:12px 5px 10px;text-align:center;min-width:0}.day-tab .day{display:block;font-weight:800;font-size:13px;color:inherit}.day-tab .abbr{display:block;font-size:11px;margin-top:3px}.day-tab.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.day-tab.done:after{content:'✓';display:block;font-size:10px;font-weight:900;margin-top:2px}.summary{background:linear-gradient(135deg,#22281c,#1a1d19);border:1px solid #3b4730;border-radius:var(--radius);padding:16px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:14px}.summary h2{font-size:21px;letter-spacing:-.035em;margin:0 0 4px}.summary p{color:var(--muted);margin:0;font-size:13px}.duration{border:1px solid #48523d;border-radius:12px;padding:9px 10px;white-space:nowrap;text-align:center}.duration strong{display:block;font-size:18px}.duration span{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}.section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}.section-head h3{margin:0;font-size:15px}.section-head span{font-size:12px;color:var(--muted)}.exercise{border:1px solid var(--line);background:var(--panel);border-radius:16px;margin-bottom:10px;overflow:hidden}.exercise-main{padding:14px 14px 11px;display:flex;align-items:flex-start;gap:12px}.number{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;border-radius:10px;background:var(--panel2);color:var(--muted);font-size:12px;font-weight:800}.ex-info{min-width:0;flex:1}.ex-name{font-weight:800;font-size:15px;letter-spacing:-.02em}.ex-meta{font-size:12px;color:var(--muted);margin-top:4px}.last{font-size:12px;color:var(--muted);margin-top:7px}.last strong{color:var(--accent);font-weight:750}.record-pill{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:4px 7px;color:var(--muted);white-space:nowrap}.inputs{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:8px;padding:0 14px 14px 56px}.field label{display:block;font-size:10px;color:var(--muted);font-weight:750;text-transform:uppercase;letter-spacing:.08em;margin:0 0 5px}.field input{width:100%;min-width:0;background:#10120f;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 8px;outline:none}.field input:focus{border-color:var(--accent)}.field input::placeholder{color:#666e61}.hint{font-size:11px;color:var(--muted);padding:0 14px 13px 56px}.bottom-actions{display:flex;gap:10px;margin-top:18px}.primary,.secondary{border-radius:13px;padding:13px 14px;font-weight:800;border:1px solid var(--line)}.primary{flex:1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.secondary{background:var(--panel);color:var(--text)}.footer-note{color:var(--muted);font-size:11px;text-align:center;margin:18px 0 0}.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--accent);color:var(--accent-ink);padding:11px 16px;border-radius:999px;font-weight:800;font-size:13px;transition:.2s;z-index:5;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.empty{color:var(--muted);font-size:12px}.history-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 14px 13px 56px}.history-head button{border:0;background:transparent;color:var(--accent);padding:0;font-size:12px;font-weight:750}.session-banner{display:none;margin:0 0 14px;padding:11px 13px;background:#252b20;border-radius:12px;font-size:12px;color:var(--muted)}.session-banner strong{color:var(--accent)}@media(min-width:560px){.app{padding-left:24px;padding-right:24px}.day-tab{padding:14px 8px}.exercise-main{padding:16px 16px 12px}.inputs{padding-left:58px;padding-right:16px}.hint{padding-left:58px}}
</style>
</head>
<body>
<main class="app">
  <div class="topline"><div class="eyebrow">Training log · 4 giorni</div><div class="week-label">ULUL · Ipertrofia</div></div>
  <h1 class="title">La tua scheda.</h1>
  <p class="sub">Registra il topset. La prossima volta sai da dove ripartire.</p>
  <nav class="day-tabs" id="dayTabs" aria-label="Giorni di allenamento"></nav>
  <section class="summary"><div><h2 id="workoutTitle">Upper A</h2><p id="workoutSubtitle">Lunedì · 6 esercizi</p></div><div class="duration"><strong id="duration">~62′</strong><span>durata</span></div></section>
  <div class="session-banner" id="sessionBanner"></div>
  <div class="section-head"><h3>Esercizi</h3><span id="exerciseCount">6 esercizi</span></div>
  <section id="exerciseList"></section>
  <div class="bottom-actions"><button class="primary" id="saveBtn">Salva allenamento</button><button class="secondary" id="clearBtn" aria-label="Svuota i valori inseriti">Svuota</button></div>
  <p class="footer-note">I dati restano salvati su questo dispositivo e browser.</p>
</main>
<div class="toast" id="toast" role="status">Allenamento salvato</div>
<script>
const workouts=[
 {id:'upperA',name:'Upper A',day:'Lunedì',short:'UP A',duration:62,exercises:[
  ['Incline Smith press','3×6–8'],['T-bar row','3×6–10'],['Machine chest press','3×8–10'],['Single arm pulldown','3×10–12'],['EZ curl','3×8–10'],['Overhead triceps extension','3×8–12']]},
 {id:'lowerA',name:'Lower A',day:'Martedì',short:'LOW A',duration:59,exercises:[
  ['Smith machine squat','3×6–10'],['Seated leg curl','3×10–12'],['Leg press','3×10–12'],['Leg extension','3×12–15'],['Cable lateral raise','4×12–15'],['Preacher curl','3×10–12'],['Reverse pec deck','2×15–20']]},
 {id:'upperB',name:'Upper B',day:'Giovedì',short:'UP B',duration:60,exercises:[
  ['Seated neutral row','3×8–10'],['Incline dumbbell press','3×8–10'],['Lat pullover','3×12–15'],['Teres pulldown','3×10–12'],['Cable chest fly','3×10–12'],['Incline dumbbell curl','3×10–12'],['Skullcrusher','3×8–12']]},
 {id:'lowerB',name:'Lower B',day:'Venerdì',short:'LOW B',duration:59,exercises:[
  ['Romanian deadlift','3×6–8'],['Bulgarian split squat','3×8–10'],['Seated leg curl','3×10–12'],['Leg extension','3×12–15'],['Hip adduction','2×15–20'],['Lateral raise','4×12–15'],['Triceps pushdown','3×10–12']]}
];
const STORE='workoutLog_v1';let active=0;let logs=load();let draft={};
function load(){try{return JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){return {}}}
function save(){localStorage.setItem(STORE,JSON.stringify(logs))}
function key(w,e){return w.id+'::'+e}
function latest(w,e){const a=logs[key(w,e)]||[];return a.length?a[a.length-1]:null}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderTabs(){document.getElementById('dayTabs').innerHTML=workouts.map((w,i)=>{const done=w.exercises.some(e=>draft[key(w,e[0])]&&draft[key(w,e[0])].weight!=='' )||w.exercises.some(e=>{const l=latest(w,e[0]);return l&&l.date===today()});return `<button class="day-tab ${i===active?'active':''} ${done?'done':''}" data-day="${i}"><span class="day">${w.day.slice(0,3)}</span><span class="abbr">${w.short}</span></button>`}).join('');document.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{active=Number(b.dataset.day);render() }))}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function render(){const w=workouts[active];renderTabs();document.getElementById('workoutTitle').textContent=w.name;document.getElementById('workoutSubtitle').textContent=`${w.day} · ${w.exercises.length} esercizi`;document.getElementById('duration').textContent=`~${w.duration}′`;document.getElementById('exerciseCount').textContent=`${w.exercises.length} esercizi`;
const todayLogs=w.exercises.filter(e=>{const l=latest(w,e[0]);return l&&l.date===today()});const banner=document.getElementById('sessionBanner');if(todayLogs.length){banner.style.display='block';banner.innerHTML=`Hai già registrato <strong>${todayLogs.length}/${w.exercises.length}</strong> esercizi oggi. Puoi aggiornare i valori e salvare di nuovo.`}else banner.style.display='none';
document.getElementById('exerciseList').innerHTML=w.exercises.map((e,i)=>{const k=key(w,e[0]),last=latest(w,e[0]),v=draft[k]||{};const weight=v.weight??'',reps=v.reps??'',rir=v.rir??'';let lastText=last?`Ultimo topset: <strong>${esc(last.weight)} kg × ${esc(last.reps)} rep · ${esc(last.rir)} RIR</strong> <span>(${last.date===today()?'oggi':formatDate(last.date)})</span>`:'<span class="empty">Ancora nessun topset registrato</span>';return `<article class="exercise"><div class="exercise-main"><div class="number">${String(i+1).padStart(2,'0')}</div><div class="ex-info"><div class="ex-name">${esc(e[0])}</div><div class="ex-meta">${e[1]} ripetizioni obiettivo · ${e[1].split('×')[0]} serie</div><div class="last">${lastText}</div></div><div class="record-pill">TOPSET</div></div><div class="inputs"><div class="field"><label for="weight-${i}">Peso · kg</label><input id="weight-${i}" inputmode="decimal" type="number" min="0" step="0.5" placeholder="—" value="${esc(weight)}" data-ex="${esc(e[0])}" data-field="weight"></div><div class="field"><label for="reps-${i}">Ripetizioni</label><input id="reps-${i}" inputmode="numeric" type="number" min="0" step="1" placeholder="—" value="${esc(reps)}" data-ex="${esc(e[0])}" data-field="reps"></div><div class="field"><label for="rir-${i}">RIR</label><input id="rir-${i}" inputmode="decimal" type="number" min="0" max="10" step="0.5" placeholder="—" value="${esc(rir)}" data-ex="${esc(e[0])}" data-field="rir"></div></div>${last?`<div class="history-head"><span class="empty">${suggestion(e,last)}</span><button data-copy="${esc(e[0])}">Usa ultimo</button></div>`:''}</article>`}).join('');
document.querySelectorAll('[data-field]').forEach(inp=>inp.addEventListener('input',()=>{const k=key(w,inp.dataset.ex);draft[k]=draft[k]||{};draft[k][inp.dataset.field]=inp.value}));document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>{const l=latest(w,b.dataset.copy);if(!l)return;draft[key(w,b.dataset.copy)]={weight:l.weight,reps:l.reps,rir:l.rir};render()}));}
function suggestion(e,l){const match=e[1].match(/(\d+)×(\d+)–(\d+)/);if(!match)return '';const min=Number(match[2]),max=Number(match[3]),r=Number(l.reps),rir=Number(l.rir);if(r>=max&&rir>=1)return 'Prossimo target: aumenta leggermente il peso';if(r<max)return `Prossimo target: prova ${Math.min(max,r+1)} rep con lo stesso peso`;return 'Prossimo target: ripeti il topset e valuta le sensazioni'}
function formatDate(s){const [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
function saveWorkout(){const w=workouts[active];let count=0;for(const e of w.exercises){const k=key(w,e[0]),v=draft[k];if(!v)continue;if(v.weight===''||v.reps===''||v.rir==='')continue;const entry={weight:String(v.weight),reps:String(v.reps),rir:String(v.rir),date:today(),time:Date.now()};logs[k]=logs[k]||[];if(logs[k].length&&logs[k][logs[k].length-1].date===today())logs[k][logs[k].length-1]=entry;else logs[k].push(entry);count++}save();draft={};render();showToast(count?`Salvati ${count} topset`:'Inserisci peso, reps e RIR per salvare')}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>t.classList.remove('show'),2100)}
document.getElementById('saveBtn').addEventListener('click',saveWorkout);document.getElementById('clearBtn').addEventListener('click',()=>{draft={};render();showToast('Campi svuotati')});render();
</script>
</body>
</html>
