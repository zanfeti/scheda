<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101010"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Scheda"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.svg"><title>Scheda</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0b;--card:#151515;--line:#303030;--text:#f3f3f3;--muted:#888;--accent:#a83232}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:env(safe-area-inset-bottom)}button,input{font:inherit}button{cursor:pointer}.app{max-width:620px;margin:auto;padding:calc(15px + env(safe-area-inset-top)) 13px 30px}.head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 18px}.brand{font-size:22px;font-weight:950;letter-spacing:-.07em;text-transform:uppercase}.mark{width:8px;height:8px;background:var(--accent);display:inline-block;margin-right:7px}.hint{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.12em}.workout{border:1px solid var(--line);background:var(--card);margin-bottom:8px;border-radius:4px;overflow:hidden}.workout-toggle{width:100%;display:flex;align-items:center;gap:12px;padding:16px 13px;border:0;background:transparent;color:var(--text);text-align:left}.workout-name{font-size:17px;font-weight:900;letter-spacing:-.04em;text-transform:uppercase;flex:1}.workout-count{font-size:11px;color:var(--muted);font-weight:800}.chev{color:var(--muted);font-size:18px;width:14px;text-align:center}.workout.open>.workout-toggle .chev{color:var(--accent)}.workout-body{display:none;padding:0 8px 8px}.workout.open>.workout-body{display:block}.exercise{border:1px solid #292929;background:#101010;border-radius:3px;margin:0 0 6px;overflow:hidden}.ex-toggle{width:100%;border:0;background:none;color:inherit;display:flex;align-items:center;gap:9px;text-align:left;padding:13px 10px;min-height:49px}.num{color:#666;font-size:10px;font-weight:850;width:17px;flex:0 0 17px}.ex-title{flex:1;font-size:13px;font-weight:800;letter-spacing:-.02em}.reps{font-size:11px;color:var(--muted);white-space:nowrap;font-weight:700}.ex-chev{font-size:15px;color:#777;width:12px;text-align:right}.exercise.open .ex-chev{color:var(--accent)}.ex-body{display:none;padding:0 10px 11px 36px}.exercise.open .ex-body{display:block}.last{font-size:12px;color:var(--muted);margin:0 0 10px}.last strong{color:#ddd;font-weight:800}.fields{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px}.field label{display:block;color:var(--muted);font-size:9px;font-weight:900;letter-spacing:.08em;margin:0 0 5px}.field input{width:100%;min-width:0;background:#080808;border:1px solid #333;border-radius:3px;padding:11px 7px;color:#fff;outline:none}.field input:focus{border-color:var(--accent)}.save{width:100%;border:0;border-radius:3px;padding:12px;margin-top:9px;background:#eee;color:#111;font-weight:900;text-transform:uppercase;font-size:11px;letter-spacing:.06em}.save:active{background:#ccc}.empty{font-size:11px;color:var(--muted);margin:0 0 10px}.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#eee;color:#111;padding:10px 14px;border-radius:3px;font-size:11px;font-weight:900;transition:.15s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:560px){.app{padding-left:20px;padding-right:20px}}
</style></head><body><main class="app"><header class="head"><div class="brand"><span class="mark"></span>Scheda</div><div class="hint">4 WORKOUT</div></header><section id="workouts"></section></main><div class="toast" id="toast"></div>
<script>
const workouts=[
{id:'ua',title:'Upper A',day:'LUN',ex:[['Incline Smith press','3×6–8'],['T-bar row','3×6–10'],['Machine chest press','3×8–10'],['Single arm pulldown','3×10–12'],['EZ curl','3×8–10'],['Overhead triceps extension','3×8–12']]},
{id:'la',title:'Lower A',day:'MAR',ex:[['Smith machine squat','3×6–10'],['Seated leg curl','3×10–12'],['Leg press','3×10–12'],['Leg extension','3×12–15'],['Cable lateral raise','4×12–15'],['Preacher curl','3×10–12'],['Reverse pec deck','2×15–20']]},
{id:'ub',title:'Upper B',day:'GIO',ex:[['Seated neutral row','3×8–10'],['Incline dumbbell press','3×8–10'],['Lat pullover','3×12–15'],['Teres pulldown','3×10–12'],['Cable chest fly','3×10–12'],['Incline dumbbell curl','3×10–12'],['Skullcrusher','3×8–12']]},
{id:'lb',title:'Lower B',day:'VEN',ex:[['Romanian deadlift','3×6–8'],['Bulgarian split squat','3×8–10'],['Seated leg curl','3×10–12'],['Leg extension','3×12–15'],['Hip adduction','2×15–20'],['Lateral raise','4×12–15'],['Triceps pushdown','3×10–12']]}
];
const KEY='scheda-hardcore-v3';let logs={};try{logs=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('scheda-hardcore-v2')||'{}')}catch(e){}const $=id=>document.getElementById(id),key=(w,e)=>w.id+'::'+e;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function latest(w,e){const a=logs[key(w,e)]||[];return a[a.length-1]||null}
function render(){ $('workouts').innerHTML=workouts.map(w=>`<article class="workout" data-workout="${w.id}"><button class="workout-toggle" aria-expanded="false"><span class="workout-name">${w.title}</span><span class="workout-count">${w.ex.length} ES</span><span class="chev">+</span></button><div class="workout-body">${w.ex.map(([name,range],i)=>{const id=key(w,name),l=latest(w,name);return `<article class="exercise" data-ex="${esc(id)}"><button class="ex-toggle" aria-expanded="false"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="ex-title">${esc(name)}</span><span class="reps">${range}</span><span class="ex-chev">+</span></button><div class="ex-body"><p class="last">ULTIMO&nbsp; <strong>${l?`${esc(l.weight)} kg × ${esc(l.reps)} · ${esc(l.rir)} RIR`:'—'}</strong></p><div class="fields"><div class="field"><label>KG</label><input type="number" min="0" step="0.5" inputmode="decimal" placeholder="kg" data-field="weight"></div><div class="field"><label>REPS</label><input type="number" min="0" step="1" inputmode="numeric" placeholder="reps" data-field="reps"></div><div class="field"><label>RIR</label><input type="number" min="0" max="10" step="0.5" inputmode="decimal" placeholder="RIR" data-field="rir"></div></div><button class="save">Salva topset</button></div></article>`}).join('')}</div></article>`).join('');
 document.querySelectorAll('.workout-toggle').forEach(b=>b.onclick=()=>{const card=b.closest('.workout');const open=!card.classList.contains('open');card.classList.toggle('open',open);b.setAttribute('aria-expanded',open);b.querySelector('.chev').textContent=open?'−':'+'});
 document.querySelectorAll('.ex-toggle').forEach(b=>b.onclick=()=>{const card=b.closest('.exercise');const open=!card.classList.contains('open');card.classList.toggle('open',open);b.setAttribute('aria-expanded',open);b.querySelector('.ex-chev').textContent=open?'−':'+';if(open){const id=card.dataset.ex,w=workouts.find(x=>id.startsWith(x.id+'::')),name=id.slice(w.id.length+2),l=latest(w,name);card.querySelectorAll('input').forEach(inp=>inp.value='');if(l){card.querySelector('[data-field="weight"]').placeholder=l.weight;card.querySelector('[data-field="reps"]').placeholder=l.reps;card.querySelector('[data-field="rir"]').placeholder=l.rir}}});
 document.querySelectorAll('.exercise .save').forEach(b=>b.onclick=()=>{const card=b.closest('.exercise'),id=card.dataset.ex;const v={};card.querySelectorAll('input').forEach(inp=>v[inp.dataset.field]=inp.value.trim());if(!v.weight||!v.reps||v.rir===''){toast('INSERISCI KG, REPS E RIR');return}logs[id]=logs[id]||[];logs[id].push({...v,date:new Date().toISOString().slice(0,10)});localStorage.setItem(KEY,JSON.stringify(logs));const last=card.querySelector('.last strong');last.textContent=`${v.weight} kg × ${v.reps} · ${v.rir} RIR`;card.querySelectorAll('input').forEach(inp=>{inp.value='';inp.placeholder=({'weight':'kg','reps':'reps','rir':'RIR'})[inp.dataset.field]});toast('SALVATO')});
}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1300)}render();
</script></body></html>
