<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101010"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Scheda"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.svg"><title>Scheda</title>
<style>
:root{color-scheme:dark;--bg:#080808;--card:#111;--line:#303030;--text:#f5f5f5;--muted:#929292;--accent:#d21f32;--accent2:#7e101c}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg);scroll-padding-bottom:150px}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(122px + env(safe-area-inset-bottom))}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}.app{max-width:620px;margin:auto;padding:calc(15px + env(safe-area-inset-top)) 12px 20px}.head{display:flex;align-items:flex-end;justify-content:space-between;margin:0 3px 20px;border-bottom:2px solid var(--accent);padding-bottom:13px}.brand{font-size:29px;line-height:1;font-weight:1000;letter-spacing:-.08em;text-transform:uppercase}.mark{width:10px;height:10px;background:var(--accent);display:inline-block;margin-right:8px;transform:skew(-12deg)}.hint{font-size:11px;color:var(--accent);font-weight:950;letter-spacing:.14em}.motto{font-size:12px;letter-spacing:.18em;font-weight:950;color:#eee;margin:0 3px 13px}.motto span{color:var(--accent)}.workout{border:1px solid var(--line);background:var(--card);margin-bottom:9px;border-radius:5px;overflow:hidden}.workout-toggle{width:100%;display:flex;align-items:center;gap:12px;padding:20px 14px;border:0;background:transparent;color:var(--text);text-align:left;min-height:72px}.workout-name{font-size:21px;font-weight:950;letter-spacing:-.055em;text-transform:uppercase;flex:1}.workout-count{font-size:12px;color:#aaa;font-weight:900;letter-spacing:.05em}.chev{color:var(--accent);font-size:23px;font-weight:900;width:20px;text-align:center}.workout.open{border-color:#5d2027}.workout.open>.workout-toggle{background:#191010}.workout-body{display:none;padding:0 7px 7px}.workout.open>.workout-body{display:block}.exercise{border:1px solid #2a2a2a;background:#0b0b0b;border-radius:4px;margin:0 0 7px;overflow:hidden}.ex-toggle{width:100%;border:0;background:none;color:inherit;display:flex;align-items:center;gap:9px;text-align:left;padding:15px 10px;min-height:68px}.num{color:#666;font-size:12px;font-weight:950;width:22px;flex:0 0 22px}.ex-title{flex:1;font-size:16px;line-height:1.15;font-weight:900;letter-spacing:-.035em}.reps{font-size:16px;color:#fff;white-space:nowrap;font-weight:1000;background:var(--accent2);padding:6px 8px;border-radius:3px;letter-spacing:-.04em}.ex-chev{font-size:19px;color:#777;width:15px;text-align:right;font-weight:900}.exercise.open{border-color:var(--accent)}.exercise.open .ex-toggle{background:#171010}.exercise.open .ex-chev{color:var(--accent)}.ex-body{display:none;padding:12px 10px 14px}.exercise.open .ex-body{display:block}.last{font-size:13px;color:#aaa;margin:0 0 13px;text-transform:uppercase;letter-spacing:.03em}.last strong{color:#fff;font-size:15px;font-weight:900}.fields{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:8px}.field label{display:block;color:#aaa;font-size:12px;font-weight:950;letter-spacing:.12em;margin:0 0 7px}.field input{width:100%;min-width:0;height:64px;background:#050505;border:1px solid #414141;border-radius:5px;padding:8px 6px;color:#fff;outline:none;font-size:24px;font-weight:950;text-align:center;appearance:none}.field input:focus{border:2px solid var(--accent);background:#17090b}.field input::placeholder{color:#666;font-size:14px;font-weight:700}.save{display:none}.effort-dock{position:fixed;z-index:20;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(8,8,8,.97);border-top:1px solid #3b3b3b;box-shadow:0 -8px 25px #0009;backdrop-filter:blur(12px)}.dock-inner{max-width:596px;margin:auto;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.dock-copy{min-width:0}.dock-kicker{font-size:11px;line-height:1.2;font-weight:1000;letter-spacing:.18em;color:var(--accent)}.dock-exercise{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.dock-target{font-size:11px;color:#aaa;font-weight:800;margin-top:2px}.dock-save{min-height:58px;min-width:145px;border:0;border-radius:4px;background:var(--accent);color:#fff;padding:0 17px;font-size:14px;font-weight:1000;letter-spacing:.04em;text-transform:uppercase;box-shadow:inset 0 -3px 0 #650b15}.dock-save:active{transform:translateY(1px);background:#f02a40}.dock-save:disabled{background:#252525;color:#777;box-shadow:none}.toast{position:fixed;z-index:30;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#f5f5f5;color:#111;padding:12px 16px;border-radius:4px;font-size:12px;font-weight:1000;letter-spacing:.04em;transition:.15s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:560px){.app{padding-left:20px;padding-right:20px}.effort-dock{padding-left:20px;padding-right:20px}}@media(max-width:360px){.ex-title{font-size:14px}.reps{font-size:14px;padding:6px}.dock-save{min-width:125px;padding:0 11px}.field input{font-size:21px}}
</style></head><body><main class="app"><header class="head"><div class="brand"><span class="mark"></span>Scheda</div><div class="hint">4 WORKOUT</div></header><p class="motto">NO EXCUSES. <span>JUST EFFORT.</span></p><section id="workouts"></section></main><div class="effort-dock"><div class="dock-inner"><div class="dock-copy"><div class="dock-kicker">EFFORT // HARDCORE</div><div class="dock-exercise" id="dockExercise">APRI UN ESERCIZIO</div><div class="dock-target" id="dockTarget">Registra il topset. Spingi forte.</div></div><button class="dock-save" id="saveActive" disabled>SALVA<br>TOPSET</button></div></div><div class="toast" id="toast"></div>
<script>
const workouts=[
{id:'ua',title:'Upper A',day:'LUN',ex:[['Incline Smith press','3×6–8'],['T-bar row','3×6–10'],['Machine chest press','3×8–10'],['Single arm pulldown','3×10–12'],['EZ curl','3×8–10'],['Overhead triceps extension','3×8–12']]},
{id:'la',title:'Lower A',day:'MAR',ex:[['Smith machine squat','3×6–10'],['Seated leg curl','3×10–12'],['Leg press','3×10–12'],['Leg extension','3×12–15'],['Cable lateral raise','4×12–15'],['Preacher curl','3×10–12'],['Reverse pec deck','2×15–20']]},
{id:'ub',title:'Upper B',day:'GIO',ex:[['Seated neutral row','3×8–10'],['Incline dumbbell press','3×8–10'],['Lat pullover','3×12–15'],['Teres pulldown','3×10–12'],['Cable chest fly','3×10–12'],['Incline dumbbell curl','3×10–12'],['Skullcrusher','3×8–12']]},
{id:'lb',title:'Lower B',day:'VEN',ex:[['Romanian deadlift','3×6–8'],['Bulgarian split squat','3×8–10'],['Seated leg curl','3×10–12'],['Leg extension','3×12–15'],['Hip adduction','2×15–20'],['Lateral raise','4×12–15'],['Triceps pushdown','3×10–12']]}
];
const KEY='scheda-hardcore-v3';let activeCard=null;let logs={};try{logs=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('scheda-hardcore-v2')||'{}')}catch(e){}const $=id=>document.getElementById(id),key=(w,e)=>w.id+'::'+e;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function latest(w,e){const a=logs[key(w,e)]||[];return a[a.length-1]||null}
function render(){ $('workouts').innerHTML=workouts.map(w=>`<article class="workout" data-workout="${w.id}"><button class="workout-toggle" aria-expanded="false"><span class="workout-name">${w.title}</span><span class="workout-count">${w.ex.length} ES</span><span class="chev">+</span></button><div class="workout-body">${w.ex.map(([name,range],i)=>{const id=key(w,name),l=latest(w,name);return `<article class="exercise" data-ex="${esc(id)}"><button class="ex-toggle" aria-expanded="false"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="ex-title">${esc(name)}</span><span class="reps">${range}</span><span class="ex-chev">+</span></button><div class="ex-body"><p class="last">ULTIMO&nbsp; <strong>${l?`${esc(l.weight)} kg × ${esc(l.reps)} · ${esc(l.rir)} RIR`:'—'}</strong></p><div class="fields"><div class="field"><label>KG</label><input type="number" min="0" step="0.5" inputmode="decimal" placeholder="kg" data-field="weight"></div><div class="field"><label>REPS</label><input type="number" min="0" step="1" inputmode="numeric" placeholder="reps" data-field="reps"></div><div class="field"><label>RIR</label><input type="number" min="0" max="10" step="0.5" inputmode="decimal" placeholder="RIR" data-field="rir"></div></div></div></article>`}).join('')}</div></article>`).join('');
 document.querySelectorAll('.workout-toggle').forEach(b=>b.onclick=()=>{const card=b.closest('.workout');const open=!card.classList.contains('open');card.classList.toggle('open',open);b.setAttribute('aria-expanded',open);b.querySelector('.chev').textContent=open?'−':'+';if(!open&&activeCard&&card.contains(activeCard)){activeCard=null;updateDock()}});
 document.querySelectorAll('.ex-toggle').forEach(b=>b.onclick=()=>{const card=b.closest('.exercise');const open=!card.classList.contains('open');card.classList.toggle('open',open);b.setAttribute('aria-expanded',open);b.querySelector('.ex-chev').textContent=open?'−':'+';if(open){activeCard=card;const id=card.dataset.ex,w=workouts.find(x=>id.startsWith(x.id+'::')),name=id.slice(w.id.length+2),l=latest(w,name);card.querySelectorAll('input').forEach(inp=>{inp.value='';inp.placeholder=({'weight':'KG','reps':'REPS','rir':'RIR'})[inp.dataset.field]});if(l){card.querySelector('[data-field="weight"]').placeholder=l.weight;card.querySelector('[data-field="reps"]').placeholder=l.reps;card.querySelector('[data-field="rir"]').placeholder=l.rir}updateDock()}else if(activeCard===card){activeCard=null;updateDock()}});
 $('saveActive').onclick=()=>saveCard(activeCard);
}
function updateDock(){const btn=$('saveActive');btn.disabled=!activeCard;if(!activeCard){$('dockExercise').textContent='APRI UN ESERCIZIO';$('dockTarget').textContent='Registra il topset. Spingi forte.';return}const id=activeCard.dataset.ex,w=workouts.find(x=>id.startsWith(x.id+'::')),name=id.slice(w.id.length+2),ex=w.ex.find(x=>x[0]===name),l=latest(w,name);$('dockExercise').textContent=name.toUpperCase();$('dockTarget').textContent=`TARGET ${ex[1]}${l?'  ·  ULTIMO '+l.weight+' KG × '+l.reps+' / '+l.rir+' RIR':''}`}
function saveCard(card){if(!card)return;const id=card.dataset.ex;const v={};card.querySelectorAll('input').forEach(inp=>v[inp.dataset.field]=inp.value.trim());if(!v.weight||!v.reps||v.rir===''){toast('INSERISCI KG, REPS E RIR');return}logs[id]=logs[id]||[];logs[id].push({...v,date:new Date().toISOString().slice(0,10)});localStorage.setItem(KEY,JSON.stringify(logs));const last=card.querySelector('.last strong');last.textContent=`${v.weight} kg × ${v.reps} · ${v.rir} RIR`;card.querySelectorAll('input').forEach(inp=>{inp.value='';inp.placeholder=({'weight':'KG','reps':'REPS','rir':'RIR'})[inp.dataset.field]});updateDock();toast('TOPSET SALVATO // EFFORT')};
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1300)}render();
</script></body></html>
